services:
  mongo:
    image: mongo:7
    container_name: ejug-notify-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ejug_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ejug-notify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ejug_redis_data:/data

  api:
    image: node:20-alpine
    container_name: ejug-notify-api
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/ejug_notify
      REDIS_URL: redis://redis:6379
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      - mongo
      - redis

  frontend:
    image: node:20-alpine
    container_name: ejug-notify-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:3000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  ejug_mongo_data:
  ejug_redis_data:
  api_node_modules:
  frontend_node_modules: